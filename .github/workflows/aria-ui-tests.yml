name: ARIA desktop UI checks

on:
  pull_request:
    paths:
      - "aria_desktop/**"
      - ".github/workflows/aria-ui-tests.yml"
  workflow_dispatch:

jobs:
  desktop-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.28.3" "flet-audio==0.1.0" "httpx>=0.27,<1" "python-dotenv>=1.0,<2" "pytest>=8,<10"
      - name: Compile Python sources
        run: python -m compileall -q aria_desktop
      - name: Desktop UI contract tests
        run: python -m pytest aria_desktop/tests -q
