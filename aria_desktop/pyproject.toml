[project]
name = "aria-vocal"
version = "0.5.0"
description = "ARIA multilingual voice and quick phrase app"
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "flet-audio==0.1.0",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[tool.flet]
org = "org.aria.testing"
product = "A.R.I.A"
company = "A.R.I.A Project"
copyright = "A.R.I.A Project"

[tool.flet.app]
path = "."
module = "aria_app"
# Never ship environment files, tests, cached bytecode, or local build environments.
exclude = [".env", ".env.*", ".venv", "tests", "__pycache__", ".pytest_cache", "README.md"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.flet.android.manifest_application]
# Free LAN testing against the local HTTP backend. Use HTTPS for untrusted networks.
usesCleartextTraffic = "true"
